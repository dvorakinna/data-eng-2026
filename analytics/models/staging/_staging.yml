version: 2

# Column-level tests run as SELECTs; any returned row = test failure
models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: country
        data_tests:
          - accepted_values:
              values: ['CH','DE','AT','FR','IT']   # adjust to match real seed data

  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: price
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"                    # no negative prices

  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:   { to: ref('stg_customers'), field: customer_id } # referential integrity
      - name: status
        data_tests:
          - accepted_values:
              values: ['pending','paid','shipped','cancelled']

  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships: { to: ref('stg_orders'),   field: order_id }
      - name: product_id
        data_tests:
          - relationships: { to: ref('stg_products'), field: product_id }