services:
  postgres:
    image: postgres:16-alpine
    container_name: dbt-postgres
    environment:
      POSTGRES_USER: dbt
      POSTGRES_PASSWORD: dbt
      POSTGRES_DB: source
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt -d source"]
      interval: 5s
      retries: 5

  dbt:
    build:
      context: .
      dockerfile: Dockerfile
    image: dbt-multi:1.8
    container_name: dbt-runner
    working_dir: /usr/app/dbt
    volumes:
      - ../analytics:/usr/app/dbt
      - ../profiles:/root/.dbt
    environment:
      DBT_PROFILES_DIR: /root/.dbt
    entrypoint: ["dbt"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: